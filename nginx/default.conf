# Mirrors platform-tooling/docker/nginx/angular.conf as of TOOL-1044. If they drift, that one wins.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # CSP is set by the route/WAF in every real environment. This header is the laptop fallback and
    # is looser than production on purpose (the mock IdP is plain http).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://host.docker.internal:4501/api/;
        proxy_set_header X-Correlation-Id $request_id;
    }
    location /health {
        proxy_pass http://host.docker.internal:4501/health;
    }

    location ~* \.(js|css|woff2|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
