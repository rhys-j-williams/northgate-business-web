<cn-page-header title="ACH origination" lede="Uploaded NACHA files and their status through the ACH window." eyebrow="Payments">
  <cn-button cnPageAction variant="secondary" routerLink="/ach/templates">Templates</cn-button>
  <cn-button cnPageAction *ngIf="canUpload" variant="primary" icon="cn:arrow-up" (pressed)="upload()">Upload file</cn-button>
</cn-page-header>

<mbz-page-loading *ngIf="loading"></mbz-page-loading>
<cn-card *ngIf="error" title="Unavailable" [highlight]="true"><p class="mbz-muted">{{ error }}</p></cn-card>

<ng-container *ngIf="!loading && !error">
  <div class="mbz-toolbar">
    <cn-filter-chips [chips]="statusChips" [multiple]="true" [(ngModel)]="statusFilter" ariaLabel="Filter by status"></cn-filter-chips>
  </div>

  <cn-card [padded]="false">
    <cn-data-table [columns]="columns" [rows]="visible" caption="ACH batches" [pageSize]="25" emptyText="No ACH files match" (rowClick)="open($event)"></cn-data-table>
  </cn-card>
</ng-container>
