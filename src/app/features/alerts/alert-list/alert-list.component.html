<cn-page-header title="Alerts" lede="Balance and payment alerts for this organisation. Regulatory alerts cannot be turned off." eyebrow="Settings"></cn-page-header>

<mbz-page-loading *ngIf="loading"></mbz-page-loading>
<cn-card *ngIf="error" title="Unavailable" [highlight]="true"><p class="mbz-muted">{{ error }}</p></cn-card>

<ng-container *ngIf="!loading && !error">
  <h3 class="mbz-section-heading">Required</h3>
  <div class="mbz-grid mbz-grid--2">
    <mbz-alert-card *ngFor="let a of regulatory" [alert]="a" [saving]="saving[a.alertId]" (thresholdEdit)="editThreshold(a)"></mbz-alert-card>
  </div>

  <h3 class="mbz-section-heading">Optional</h3>
  <div class="mbz-grid mbz-grid--2">
    <mbz-alert-card *ngFor="let a of optional" [alert]="a" [saving]="saving[a.alertId]" (enabledChange)="toggle(a, $event)" (thresholdEdit)="editThreshold(a)"></mbz-alert-card>
  </div>
  <p class="mbz-muted">Card and fraud alerts are managed in Meridian Online. Delivery channels are set by the bank; MBZ-1450 (SMS opt in) was closed won't-do.</p>
</ng-container>
